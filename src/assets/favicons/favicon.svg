<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Rhema">
  <title>Rhema</title>
  <!--
    The Rhema mark: a rho glyph (stem and bowl) rising out of a speech waveform.
    Geometry is the same 100x100 viewBox and the same bezier control points used
    by assets/make_icon.py in the app repo, which rasterises the installer icon,
    so this stays visually identical to the .ico shipped with the application.
    Colours: #10131A ground, #5B8FF7 signal (the app's own accent).

    Unlike the template's original favicon this does not invert for dark mode:
    the mark is a badge with its own dark ground, so it reads correctly on both
    light and dark backgrounds as-is.
  -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#10131A" />
  <g fill="none" stroke="#5B8FF7" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- waveform -->
    <path d="M18 76 C24 56 30 56 34 76 C37 90 40 90 44 76" />
    <!-- rho stem -->
    <path d="M44 14 L44 76" />
    <!-- rho bowl -->
    <path d="M44 14 C61 14 74 21 74 33 C74 45 61 48 44 48" />
  </g>
</svg>
